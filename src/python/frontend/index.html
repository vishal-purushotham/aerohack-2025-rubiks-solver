<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AeroHack 2025 - Rubik's Cube Solver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #333; color: white; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #ui-container { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 5px; }
        .solution-text { font-family: monospace; word-break: break-all; max-height: 150px; overflow-y: auto; background: #222; padding: 5px; border-radius: 3px; }
        #messages-container { position: absolute; top: 10px; right: 10px; width: 300px; z-index: 101; }
        .alert { background: #ffc107; color: #333; padding: 10px; border-radius: 3px; margin-bottom: 5px; opacity: 1; transition: opacity 0.5s; }
        .fade-out { opacity: 0; }
    </style>
</head>
<body>
    <div id="ui-container">
        <h4>AeroHack 2025 Solver</h4>
        <p>Solution:</p>
        <div id="solution-display" class="solution-text"></div>
        <button class="btn btn-primary mt-2" id="solve-button" onclick="handleSolve()">Animate Solution</button>
        <button class="btn btn-secondary mt-2" id="reset-button" onclick="resetState()">Reset Cube</button>
    </div>
    <div id="canvas-container"></div>
    <div id="messages-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/105/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.105.2/examples/js/controls/OrbitControls.js"></script>
    <script type="module" src="modules/main.js"></script>
</body>
</html>
